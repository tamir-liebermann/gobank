app = "truelaunchdetector"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.gobank"

[env]
  PORT = "5252"

[http_service]
  internal_port = 5252
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    hard_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
